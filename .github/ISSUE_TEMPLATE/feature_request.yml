name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! ✨

        Please provide detailed information about your feature request to help us understand and evaluate it.

  - type: textarea
    id: feature-summary
    attributes:
      label: 🎯 Feature Summary
      description: A clear and concise description of the feature you'd like to see
      placeholder: Describe the feature in one or two sentences...
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: 🤔 Problem Statement
      description: What problem does this feature solve? What's the current pain point?
      placeholder: |
        As a [user type], I'm frustrated when [describe situation] because [explain impact].
        This makes it difficult to [describe consequence].
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 💡 Proposed Solution
      description: Describe how you envision this feature working
      placeholder: |
        I would like to see [describe solution].
        This would work by [explain functionality].
        Users would benefit because [explain benefits].
    validations:
      required: true

  - type: dropdown
    id: feature-type
    attributes:
      label: 🏷️ Feature Type
      description: What type of feature is this?
      options:
        - New Web Scraper (New website integration)
        - Enhancement (Improve existing functionality)
        - API Feature (New API endpoints or capabilities)
        - Database Feature (New data models or queries)
        - Bot Feature (New bot commands or automation)
        - Configuration (New settings or options)
        - Performance (Speed or efficiency improvements)
        - Security (Security-related enhancements)
        - Monitoring (Logging, metrics, or alerting)
        - Developer Experience (Tools or workflow improvements)
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 🚀 Priority
      description: How important is this feature to you?
      options:
        - Critical (Blocking current work)
        - High (Would significantly improve workflow)
        - Medium (Nice to have, moderate impact)
        - Low (Minor improvement)
    validations:
      required: true

  - type: textarea
    id: user-stories
    attributes:
      label: 👥 User Stories
      description: Describe how different users would interact with this feature
      placeholder: |
        **As a** [user type]
        **I want** [goal]
        **So that** [benefit]

        **As a** [another user type]
        **I want** [goal]
        **So that** [benefit]
      render: markdown

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: ✅ Acceptance Criteria
      description: What specific requirements must be met for this feature to be considered complete?
      placeholder: |
        - [ ] Feature requirement 1
        - [ ] Feature requirement 2
        - [ ] Feature requirement 3
        - [ ] Performance requirement (if applicable)
        - [ ] Security requirement (if applicable)
      render: markdown

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternative Solutions
      description: Describe any alternative solutions or features you've considered
      placeholder: |
        Alternative 1: [describe approach and why it's less ideal]
        Alternative 2: [describe approach and why it's less ideal]

  - type: textarea
    id: mockups
    attributes:
      label: 🎨 Mockups/Examples
      description: If applicable, add mockups, wireframes, or examples from other tools
      placeholder: You can drag and drop images here or provide links to examples

  - type: dropdown
    id: complexity
    attributes:
      label: 🧩 Estimated Complexity
      description: How complex do you think this feature would be to implement?
      options:
        - Simple (Few hours of work)
        - Moderate (1-3 days of work)
        - Complex (1-2 weeks of work)
        - Very Complex (Weeks or months of work)
        - Unknown (Not sure about complexity)
    validations:
      required: true

  - type: textarea
    id: technical-considerations
    attributes:
      label: ⚙️ Technical Considerations
      description: Any technical aspects, dependencies, or constraints to consider?
      placeholder: |
        - Database changes required: [Yes/No - describe]
        - API changes required: [Yes/No - describe]
        - Third-party integrations: [List any]
        - Performance concerns: [Describe any]
        - Security considerations: [List any]

  - type: checkboxes
    id: impact-areas
    attributes:
      label: 📊 Impact Areas
      description: Which areas of the system would this feature affect?
      options:
        - label: Web Scraping 
        - label: Database Schema
        - label: API Endpoints
        - label: Bot/Automation Jobs
        - label: Configuration System
        - label: Monitoring/Logging
        - label: Documentation
        - label: Testing
        - label: Deployment Process

  - type: textarea
    id: success-metrics
    attributes:
      label: 📈 Success Metrics
      description: How would we measure the success of this feature?
      placeholder: |
        - Metric 1: [How to measure]
        - Metric 2: [How to measure]
        - User satisfaction: [How to measure]

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided a clear problem statement and proposed solution
          required: true
        - label: This feature aligns with the project's goals and scope
          required: true
        - label: I am willing to help with testing this feature once implemented
          required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 📋 Additional Context
      description: Add any other context, screenshots, or examples about the feature request
      placeholder: Any additional information that would be helpful...

  - type: textarea
    id: implementation-help
    attributes:
      label: 🤝 Implementation Help
      description: Are you willing/able to help implement this feature?
      placeholder: |
        - [ ] I can help with design/planning
        - [ ] I can help with implementation
        - [ ] I can help with testing
        - [ ] I can help with documentation
        - [ ] I prefer to just provide feedback
      render: markdown
