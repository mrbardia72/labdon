name: Go Linting & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"

env:
  GO_VERSION: "1.23"
  GOLANGCI_LINT_VERSION: "v1.63.3"

jobs:
  # Basic Go checks
  go-basic-checks:
    name: Basic Go Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "1.24"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            echo "Please run 'gofmt -s -w .'"
            exit 1
          fi

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.24'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out

  # Advanced linting with golangci-lint
  golangci-lint:
    name: GolangCI-Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=10m --config=.golangci.yml
          only-new-issues: false
          skip-cache: false
          skip-pkg-cache: false
          skip-build-cache: false

  # Security and vulnerability checks
  security-checks:
    name: Security & Vulnerability Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec (security scanner)
        run: gosec -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true

      # - name: Upload SARIF file
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: gosec-results.sarif

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # Additional code quality tools
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Install ineffassign
        run: go install github.com/gordonklaus/ineffassign@latest

      - name: Run ineffassign
        run: ineffassign ./...

      - name: Install misspell
        run: go install github.com/client9/misspell/cmd/misspell@latest

      - name: Run misspell
        run: misspell -error .

      - name: Install goconst
        run: go install github.com/jgautheron/goconst/cmd/goconst@latest

      - name: Run goconst
        run: goconst ./...

      - name: Install unparam
        run: go install mvdan.cc/unparam@latest

      - name: Run unparam
        run: unparam ./...

  # Import and dependency checks
  import-checks:
    name: Import & Dependency Checks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check goimports
        run: |
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "The following files have import issues:"
            goimports -l .
            echo "Please run 'goimports -w .'"
            exit 1
          fi

      - name: Install gci (import formatting)
        run: go install github.com/daixiang0/gci@latest

      - name: Check import order with gci
        run: gci diff --skip-generated -s standard -s default -s "prefix(github.com/labdon_site)" .
        continue-on-error: true

      - name: Install modtidy
        run: go install github.com/keilerkonzept/modtidy@latest
        continue-on-error: true

      - name: Check unused dependencies
        run: modtidy check
        continue-on-error: true

  # Documentation and naming checks
  documentation-checks:
    name: Documentation & Naming
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install godoc
        run: go install golang.org/x/tools/cmd/godoc@latest

      - name: Install revive (better golint replacement)
        run: go install github.com/mgechev/revive@latest

      - name: Run revive
        run: revive -config revive.toml -formatter friendly ./...
        continue-on-error: true

      - name: Install betteralign
        run: go install github.com/dkorunic/betteralign/cmd/betteralign@latest
        continue-on-error: true

      - name: Check struct alignment
        run: betteralign ./...
        continue-on-error: true

  # Performance and optimization checks
  performance-checks:
    name: Performance Analysis
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install prealloc
        run: go install github.com/alexkohler/prealloc@latest

      - name: Run prealloc
        run: prealloc ./...

      - name: Run benchmarks
        run: go test -bench=. -benchmem ./...
        continue-on-error: true

  # Final summary job
  lint-summary:
    name: Linting Summary
    runs-on: ubuntu-latest
    needs:
      [
        go-basic-checks,
        golangci-lint,
        security-checks,
        code-quality,
        import-checks,
        documentation-checks,
        performance-checks,
      ]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "=== Go Linting & Code Quality Summary ==="
          echo "Basic Checks: ${{ needs.go-basic-checks.result }}"
          echo "GolangCI-Lint: ${{ needs.golangci-lint.result }}"
          echo "Security Checks: ${{ needs.security-checks.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Import Checks: ${{ needs.import-checks.result }}"
          echo "Documentation: ${{ needs.documentation-checks.result }}"
          echo "Performance: ${{ needs.performance-checks.result }}"

          if [[ "${{ needs.go-basic-checks.result }}" == "failure" ||
                "${{ needs.golangci-lint.result }}" == "failure" ||
                "${{ needs.security-checks.result }}" == "failure" ||
                "${{ needs.code-quality.result }}" == "failure" ||
                "${{ needs.import-checks.result }}" == "failure" ]]; then
            echo "❌ Some critical checks failed!"
            exit 1
          else
            echo "✅ All critical checks passed!"
          fi
