name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test and build
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "1.24"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go test -v -bench=. -benchmem ./...

      - name: Generate test report
        if: matrix.go-version == '1.24'
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          go test -v ./... 2>&1 | go-junit-report > test-results.xml

      - name: Upload coverage reports
        if: matrix.go-version == '1.24'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results
        if: matrix.go-version == '1.24'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Build application
        run: |
          # Build for multiple platforms
          GOOS=linux GOARCH=amd64 go build -v -o bin/labdon-linux-amd64 ./bot/cmd/sites
          GOOS=linux GOARCH=arm64 go build -v -o bin/labdon-linux-arm64 ./bot/cmd/sites
          GOOS=darwin GOARCH=amd64 go build -v -o bin/labdon-darwin-amd64 ./bot/cmd/sites
          GOOS=darwin GOARCH=arm64 go build -v -o bin/labdon-darwin-arm64 ./bot/cmd/sites
          GOOS=windows GOARCH=amd64 go build -v -o bin/labdon-windows-amd64.exe ./bot/cmd/sites

      - name: Build admin tool
        run: |
          GOOS=linux GOARCH=amd64 go build -v -o bin/admin-linux-amd64 ./bot/cmd/tooling/admin

      - name: Upload build artifacts
        if: matrix.go-version == '1.24'
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

