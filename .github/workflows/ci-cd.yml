  # Summary job
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    # NOTE: "docker" intentionally omitted — its job is commented out above.
    # Listing a job here that has no matching job definition fails workflow
    # parsing entirely (not just this job), so keep this list in sync with
    # whatever is actually uncommented.
    needs: [test, security]
    if: always()

    steps:
      - name: Check pipeline results
        run: |
          echo "=== CI/CD Pipeline Summary ==="
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"

          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ Tests failed!"
            exit 1
